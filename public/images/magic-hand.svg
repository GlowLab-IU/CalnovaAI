        <path d="M50 10C50 4.47715 54.4772 0 60 0C65.5228 0 70 4.47715 70 10V45C70 47.7614 72.2386 50 75 50H85C90.5228 50 95 54.4772 95 60V80C95 107.614 72.6142 130 45 130H35C15.67 130 0 114.33 0 95V80C0 75.896 1.33138 71.8698 3.8296 68.5527L18.4342 49.1653C20.8293 45.9867 22.5 42.1379 22.5 38.1623V35C22.5 29.4772 26.9772 25 32.5 25C38.0228 25 42.5 29.4772 42.5 35V45C42.5 47.7614 44.7386 50 47.5 50H50V10Z"
